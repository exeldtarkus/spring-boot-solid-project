# Nama aplikasi
spring.application.name=springboot-app

# Profil aktif
# spring.profiles.active=prod

# Konsul discovery dan config
spring.cloud.consul.enabled=true
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.config.enabled=true

# Host dan port Konsul (dari docker-compose environment)
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}

# Gunakan konfigurasi dari Consul KV
spring.config.import=consul:

# Prefix dan key KV
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.name=springboot-app

# Format key: config/springboot-app/<property-name>
# Contoh key: config/springboot-app/spring.datasource.url

# Optional: fail-fast false biar app tetap jalan kalau config tidak ditemukan
spring.cloud.consul.config.fail-fast=false

# Logging (bantu debug)
logging.level.org.springframework.boot.context.config=DEBUG
